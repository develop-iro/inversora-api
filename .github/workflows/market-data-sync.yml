name: Market data sync

on:
  schedule:
    # Run incremental batches every 3 hours without depending on a merge to main.
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      price_batch_size:
        description: Symbols per price batch.
        required: false
        default: '120'
      max_batches:
        description: Maximum batches to process in this run.
        required: false
        default: '1'
      pause_ms:
        description: Pause between batches in milliseconds.
        required: false
        default: '65000'

concurrency:
  group: sync-production-data
  cancel-in-progress: false

jobs:
  sync-production-data:
    name: Sync production market data
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      APP_ENV: pro
      NODE_ENV: production
      # Prefer *_PRODUCTION secrets; fall back to unscoped secrets/vars when present.
      DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION || secrets.DATABASE_URL }}
      FMP_API_KEY: ${{ secrets.FMP_API_KEY_PRODUCTION || secrets.FMP_API_KEY || vars.FMP_API_KEY_PRODUCTION || vars.FMP_API_KEY }}
      # Optional overrides. When blank, Nest derives these from DATABASE_URL.
      POSTGRES_USER: ${{ secrets.POSTGRES_USER_PRODUCTION || secrets.POSTGRES_USER || vars.POSTGRES_USER_PRODUCTION || vars.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD_PRODUCTION || secrets.POSTGRES_PASSWORD || vars.POSTGRES_PASSWORD_PRODUCTION || vars.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB_PRODUCTION || secrets.POSTGRES_DB || vars.POSTGRES_DB_PRODUCTION || vars.POSTGRES_DB }}
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST_PRODUCTION || secrets.POSTGRES_HOST || vars.POSTGRES_HOST_PRODUCTION || vars.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT_PRODUCTION || secrets.POSTGRES_PORT || vars.POSTGRES_PORT_PRODUCTION || vars.POSTGRES_PORT }}
      FMP_DATA_SOURCE: live
      FMP_SAVE_FIXTURES: false
      SYNC_SCHEDULER_ENABLED: false
      SYNC_COMPOSITION_ENABLED: false
      ADMIN_SYNC_ENABLED: false
      ADMIN_CATALOG_ENABLED: false
      ASSISTANT_ENABLED: false
      SWAGGER_ENABLED: false
      PRODUCTION_SYNC_PRICE_BATCH_SIZE: ${{ github.event.inputs.price_batch_size || vars.PRODUCTION_SYNC_PRICE_BATCH_SIZE || '120' }}
      PRODUCTION_SYNC_MAX_BATCHES: ${{ github.event.inputs.max_batches || vars.PRODUCTION_SYNC_MAX_BATCHES || '1' }}
      PRODUCTION_SYNC_PAUSE_MS: ${{ github.event.inputs.pause_ms || vars.PRODUCTION_SYNC_PAUSE_MS || '65000' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        # Job NODE_ENV=production would omit ts-node (devDependency); the CLI needs it.
        run: npm ci --include=dev

      - name: Validate production sync secrets
        run: |
          missing=0
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::Missing DATABASE_URL. Add repository secret DATABASE_URL_PRODUCTION (or DATABASE_URL)."
            missing=1
          fi
          if [ -z "${FMP_API_KEY}" ]; then
            echo "::error::Missing FMP_API_KEY. Add repository secret FMP_API_KEY_PRODUCTION (or FMP_API_KEY / Actions variable with the same name)."
            missing=1
          fi
          if [ "${missing}" -ne 0 ]; then
            echo "::notice::POSTGRES_* secrets are optional; the API derives them from DATABASE_URL when blank."
          fi
          exit "${missing}"

      - name: Sync missing production price history and scoring
        run: >-
          npm run sync:postdeploy --
          --price-batch-size "${PRODUCTION_SYNC_PRICE_BATCH_SIZE}"
          --max-batches "${PRODUCTION_SYNC_MAX_BATCHES}"
          --pause-ms "${PRODUCTION_SYNC_PAUSE_MS}"
